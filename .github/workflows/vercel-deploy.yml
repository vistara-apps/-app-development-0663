name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder-supabase-url.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder_supabase_anon_key' }}
        VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY || 'placeholder_openai_api_key' }}
        VITE_PINATA_API_KEY: ${{ secrets.VITE_PINATA_API_KEY || 'placeholder_pinata_api_key' }}
        VITE_PINATA_SECRET_API_KEY: ${{ secrets.VITE_PINATA_SECRET_API_KEY || 'placeholder_pinata_secret_api_key' }}
        VITE_PINATA_GATEWAY: ${{ secrets.VITE_PINATA_GATEWAY || 'https://gateway.pinata.cloud' }}
        VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY || 'placeholder_stripe_public_key' }}
        VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'http://localhost:5173' }}
        VITE_APP_NAME: ${{ secrets.VITE_APP_NAME || 'MemeMaster AI' }}
        VITE_APP_DESCRIPTION: ${{ secrets.VITE_APP_DESCRIPTION || 'Craft viral memes with AI, powered by your unique humor.' }}
      continue-on-error: true
        
    - name: Deploy to Vercel (Production)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.VERCEL_TOKEN != ''
      uses: amondnet/vercel-action@v25
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      continue-on-error: true
        
    - name: Deploy to Vercel (Preview)
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && env.VERCEL_TOKEN != ''
      uses: amondnet/vercel-action@v25
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--no-wait'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      continue-on-error: true
        
    - name: Comment PR with deployment URL
      if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != ''
      uses: actions/github-script@v7
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      with:
        script: |
          try {
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const latestDeployment = deployments[0];
            if (latestDeployment) {
              const deploymentUrl = `https://${latestDeployment.environment}.vercel.app`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview Deployment Ready!**
                \n\n📱 **URL:** ${deploymentUrl}
                \n\nThis preview will be automatically updated when you push new commits to this PR.`
              });
            }
          } catch (error) {
            console.log('Error getting deployment info:', error);
          }
          
    - name: Skip Vercel deployment notice
      if: github.event_name == 'pull_request' && env.VERCEL_TOKEN == ''
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: echo "Skipping Vercel deployment - VERCEL_TOKEN not configured"
      
    - name: Build success notification
      if: success()
      run: echo "Workflow completed successfully"

